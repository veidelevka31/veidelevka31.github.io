<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ford Dev</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      text-align: center;
    }
    .container {
      padding: 50px 20px;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }
    p {
      font-size: 20px;
      opacity: 0.8;
    }
    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 30px;
      margin-top: 30px;
      display: inline-block;
      backdrop-filter: blur(10px);
    }
    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      border-radius: 30px;
      background: #00c6ff;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }
    a.button:hover {
      background: #0072ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Ford Dev</h1>
    <p>Разработчик игр и приложений</p>

    <div class="card">
      <h2>Обо мне</h2>
      <p>Создаю игры, экспериментирую с кодом и делаю крутые проекты.</p>
      
      <a class="button" href="#">Мои проекты</a>
    </div>

    <div class="card">
      <h2>Контакты</h2>
      <p>Email: your@email.com</p>
      <p>Telegram: @yourname</p>
    </div>
  </div>
</body>
</html>
